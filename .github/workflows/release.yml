name: Plugin Release

on:
  push:
    branches:
      - main
    paths:
      - "package.v2.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py package.v2.json

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          process_package() {
            local pkg_file="$1"
            mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)"' "$pkg_file")

            if [ "${#entries[@]}" -eq 0 ]; then
              echo "No plugins with release=true in $pkg_file"
              return 0
            fi

            for entry in "${entries[@]}"; do
              plugin_id="${entry%%|*}"
              plugin_version="${entry##*|}"
              plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"
              plugin_dir="plugins.v2/${plugin_id_lc}"

              if [ ! -d "$plugin_dir" ]; then
                echo "ERROR: directory not found: $plugin_dir"
                exit 1
              fi

              tag="${plugin_id}_v${plugin_version}"
              asset="${plugin_id_lc}_v${plugin_version}.zip"
              release_notes="$(jq -r --arg plugin_id "$plugin_id" --arg version "v$plugin_version" '.[$plugin_id].history[$version] // empty' "$pkg_file")"
              if [ -z "$release_notes" ]; then
                release_notes="Automated release of $plugin_id $plugin_version"
              fi

              prev_tag="$(git tag --list "${plugin_id}_v*" --sort=-version:refname | head -n 1 || true)"
              if [ -n "$prev_tag" ] && git diff --quiet "$prev_tag" -- "$plugin_dir"; then
                echo "No changes in $plugin_dir since $prev_tag, skip packaging $plugin_id"
                continue
              fi

              echo "Packing $plugin_id from $plugin_dir -> $asset"
              rm -f "$asset"
              PLUGIN_DIR="$plugin_dir" ASSET="$asset" python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          plugin_dir = Path(os.environ["PLUGIN_DIR"])
          output = Path(os.environ["GITHUB_WORKSPACE"]) / os.environ["ASSET"]
          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(plugin_dir.rglob("*")):
                  if not path.is_file():
                      continue
                  if path.name == ".DS_Store" or path.suffix == ".pyc" or "__pycache__" in path.parts:
                      continue
                  archive.write(path, (Path(plugin_dir.name) / path.relative_to(plugin_dir)).as_posix())
          PY

              if gh release view "$tag" >/dev/null 2>&1; then
                gh release delete "$tag" -y
                git push origin ":refs/tags/$tag" || true
              fi
              git tag -d "$tag" >/dev/null 2>&1 || true

              gh release create "$tag" "$asset" \
                --title "$tag" \
                --notes "$release_notes" \
                --latest \
                --target "$GITHUB_SHA"
            done
          }

          process_package "package.v2.json"
